<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TALHA AI — Offline</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: rgba(17, 24, 39, 0.7);
      border: 1px solid rgba(6, 182, 212, 0.2);
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 440px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .icon {
      width: 72px;
      height: 72px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    button {
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }
    button:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/pwa-192x192.png" alt="TALHA AI" class="icon">
    <h1>You are Offline</h1>
    <p>TALHA AI needs an active internet connection to generate fresh AI responses, reasoning, and search data. Your locally saved conversations remain safe.</p>
    <button onclick="window.location.reload()">Check Connection &amp; Retry</button>
  </div>
</body>
</html>
